<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskWall</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #0d0e12;
            --bg-card: #15171e;
            --bg-card-hover: #1c1f29;
            --border-color: #242733;
            --border-hover: #3b3f52;
            --accent-amber: #f59e0b;
            --accent-amber-glow: rgba(245, 158, 11, 0.15);
            --accent-gold: #fbbf24;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            user-select: none;
        }

        /* Main Window Layout */
        .app-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left Content Workspace */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 32px 40px;
            overflow-y: auto;
        }

        .workspace::-webkit-scrollbar {
            width: 6px;
        }
        .workspace::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* Header Bar */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-badge {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #000;
            font-size: 18px;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-amber {
            padding: 10px 18px;
            background: var(--accent-amber);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
        }

        .btn-amber:hover {
            background: var(--accent-gold);
            transform: translateY(-1px);
        }

        .btn-outline {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-outline:hover {
            border-color: var(--border-hover);
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        /* Productivity Progress Meter */
        .progress-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 28px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .progress-percent {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .progress-track {
            height: 8px;
            background: #1e222d;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        /* Input Bar */
        .input-box {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .task-input {
            flex: 1;
            padding: 14px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14.5px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .task-input:focus {
            border-color: var(--accent-amber);
            box-shadow: 0 0 0 3px var(--accent-amber-glow);
        }

        .task-input::placeholder {
            color: var(--text-muted);
        }

        /* Nordic Minimalist Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-row {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            animation: fadeIn 0.25s ease-out;
        }

        .task-row:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .checkbox-nordic {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-nordic.checked {
            background: var(--accent-amber);
            border-color: var(--accent-amber);
            color: #000;
            font-weight: 800;
            font-size: 12px;
        }

        .task-text {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .task-row.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-icon {
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 14px;
        }

        .delete-icon:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        /* Right Panel: Wallpaper Controls & Position Grid */
        .side-panel {
            width: 360px;
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            overflow-y: auto;
        }

        .panel-section-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: #fff;
            margin-bottom: 14px;
        }

        /* 9-Dot Visual Grid Selector */
        .position-grid-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #0f1016;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .grid-cell {
            aspect-ratio: 16/10;
            background: #1a1d26;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid-cell:hover {
            border-color: var(--accent-amber);
            background: #252936;
        }

        .grid-cell.active {
            background: var(--accent-amber-glow);
            border-color: var(--accent-amber);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.2);
        }

        .grid-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .grid-cell.active .grid-dot {
            background: var(--accent-amber);
        }

        /* Control Selectors */
        .select-nordic {
            width: 100%;
            padding: 12px 14px;
            background: #0f1016;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 13.5px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .select-nordic:focus {
            border-color: var(--accent-amber);
        }

        /* Color Palette Chips */
        .palette-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .palette-chip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #0f1016;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .palette-chip:hover {
            border-color: var(--border-hover);
        }

        .palette-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .palette-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <!-- Main Workspace -->
        <div class="workspace">
            <!-- Header -->
            <div class="header">
                <div class="brand-group">
                    <div class="brand-badge">T</div>
                    <div class="brand-name">TaskWall</div>
                </div>
                <div class="header-actions">
                    <button class="btn-outline" onclick="clearCompleted()">Clear Finished</button>
                </div>
            </div>

            <!-- Productivity Progress Meter -->
            <div class="progress-card">
                <div class="progress-header">
                    <span class="progress-title">Task Completion</span>
                    <span class="progress-percent" id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="input-box">
                <input id="taskInput" type="text" class="task-input" placeholder="Add a new task..." />
                <button class="btn-amber" onclick="addTask()">+ New Task</button>
            </div>

            <!-- Task List -->
            <div class="task-list" id="taskList"></div>
        </div>

        <!-- Right Side Controls Panel -->
        <div class="side-panel">
            <div>
                <div class="panel-section-title">Wallpaper Controls</div>
                
                <!-- 9-Dot Visual Grid Selector -->
                <div class="position-grid-label">Screen Position</div>
                <div class="grid-3x3">
                    <div class="grid-cell" data-pos="top-left" onclick="selectGridPos('top-left', this)"><div class="grid-dot"></div></div>
                    <div class="grid-cell" data-pos="top" onclick="selectGridPos('top', this)"><div class="grid-dot"></div></div>
                    <div class="grid-cell" data-pos="top-right" onclick="selectGridPos('top-right', this)"><div class="grid-dot"></div></div>
                    
                    <div class="grid-cell" data-pos="left" onclick="selectGridPos('left', this)"><div class="grid-dot"></div></div>
                    <div class="grid-cell active" data-pos="center" onclick="selectGridPos('center', this)"><div class="grid-dot"></div></div>
                    <div class="grid-cell" data-pos="right" onclick="selectGridPos('right', this)"><div class="grid-dot"></div></div>
                    
                    <div class="grid-cell" data-pos="bottom-left" onclick="selectGridPos('bottom-left', this)"><div class="grid-dot"></div></div>
                    <div class="grid-cell" data-pos="bottom" onclick="selectGridPos('bottom', this)"><div class="grid-dot"></div></div>
                    <div class="grid-cell" data-pos="bottom-right" onclick="selectGridPos('bottom-right', this)"><div class="grid-dot"></div></div>
                </div>
            </div>

            <div>
                <div class="position-grid-label">Typography Style</div>
                <select id="fontSelect" class="select-nordic" style="margin-bottom:12px;">
                    <option value="sans-serif">Modern Sans-Serif</option>
                    <option value="monospace">JetBrains Monospace</option>
                    <option value="serif">Classic Serif</option>
                    <option value="cursive">Cursive</option>
                </select>

                <div class="position-grid-label">Text Scale</div>
                <select id="sizeSelect" class="select-nordic">
                    <option value="small">Small (32px)</option>
                    <option value="medium" selected>Medium (42px)</option>
                    <option value="large">Large (54px)</option>
                    <option value="xlarge">Extra Large (68px)</option>
                </select>
            </div>

            <div>
                <div class="position-grid-label">Theme Presets</div>
                <div class="palette-list">
                    <div class="palette-chip" onclick="applyPreset('#0d0e12', '#f3f4f6')">
                        <div class="palette-left">
                            <div class="color-dot" style="background:#0d0e12; border:1px solid #fff;"></div>
                            <span class="palette-name">Obsidian Dark</span>
                        </div>
                    </div>
                    <div class="palette-chip" onclick="applyPreset('#0f172a', '#38bdf8')">
                        <div class="palette-left">
                            <div class="color-dot" style="background:#0f172a;"></div>
                            <span class="palette-name">Nordic Slate</span>
                        </div>
                    </div>
                    <div class="palette-chip" onclick="applyPreset('#180828', '#f43f5e', '#4c1d95')">
                        <div class="palette-left">
                            <div class="color-dot" style="background:#180828;"></div>
                            <span class="palette-name">Midnight Violet</span>
                        </div>
                    </div>
                    <div class="palette-chip" onclick="applyPreset('#052e16', '#4ade80')">
                        <div class="palette-left">
                            <div class="color-dot" style="background:#052e16;"></div>
                            <span class="palette-name">Forest Pine</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const fontSelect = document.getElementById('fontSelect');
        const sizeSelect = document.getElementById('sizeSelect');

        let tasks = [];
        let currentPos = 'center';

        function updateProgress() {
            if (tasks.length === 0) {
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';
                return;
            }
            const completedCount = tasks.filter(t => t.isComplete).length;
            const pct = Math.round((completedCount / tasks.length) * 100);
            progressFill.style.width = `${pct}%`;
            progressPercent.textContent = `${pct}%`;
        }

        async function loadInitialData() {
            try {
                const { tasks: loadedTasks, wallpaperSettings } = await window.api.getTasks();
                tasks = loadedTasks || [];

                if (wallpaperSettings) {
                    fontSelect.value = wallpaperSettings.fontFamily || 'sans-serif';
                    sizeSelect.value = wallpaperSettings.fontSize || 'medium';
                    currentPos = wallpaperSettings.position || 'center';
                    highlightGridPos(currentPos);
                }

                renderTasks();
            } catch (e) {
                console.error('Error loading data:', e);
            }
        }

        function highlightGridPos(pos) {
            document.querySelectorAll('.grid-cell').forEach(cell => cell.classList.remove('active'));
            const target = document.querySelector(`.grid-cell[data-pos="${pos}"]`);
            if (target) target.classList.add('active');
        }

        function selectGridPos(pos, el) {
            currentPos = pos;
            highlightGridPos(pos);
            saveSettings({ position: pos });
        }

        function renderTasks() {
            updateProgress();

            if (tasks.length === 0) {
                taskList.innerHTML = `
                    <div style="text-align:center; padding:50px; color:var(--text-muted);">
                        <div style="font-size:32px; margin-bottom:8px;">📌</div>
                        <div>No tasks yet. Type a task above and press Enter!</div>
                    </div>
                `;
                return;
            }

            taskList.innerHTML = tasks.map((task, i) => `
                <div class="task-row ${task.isComplete ? 'completed' : ''}">
                    <div class="task-left">
                        <div class="checkbox-nordic ${task.isComplete ? 'checked' : ''}" onclick="toggleTask(${task.id})">
                            ${task.isComplete ? '✓' : ''}
                        </div>
                        <div class="task-text">${escapeHtml(task.text)}</div>
                    </div>
                    <div class="delete-icon" onclick="deleteTask(${task.id})">✕</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;
            const { task } = await window.api.addTask(text);
            tasks.push(task);
            taskInput.value = '';
            renderTasks();
        }

        async function deleteTask(id) {
            await window.api.deleteTask(id);
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        async function toggleTask(id) {
            const { updatedTask } = await window.api.toggleTaskStatus(id);
            const index = tasks.findIndex(t => t.id === id);
            if (index !== -1) tasks[index] = updatedTask;
            renderTasks();
        }

        async function clearCompleted() {
            const res = await window.api.clearCompletedTasks();
            tasks = res.tasks;
            renderTasks();
        }

        async function saveSettings(settings) {
            await window.api.updateSettings(settings);
        }

        function applyPreset(bg, text, gradientEnd = "") {
            saveSettings({ background: bg, text: text, gradientEnd: gradientEnd });
        }

        taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });
        fontSelect.addEventListener('change', () => saveSettings({ fontFamily: fontSelect.value }));
        sizeSelect.addEventListener('change', () => saveSettings({ fontSize: sizeSelect.value }));

        window.deleteTask = deleteTask;
        window.toggleTask = toggleTask;
        window.selectGridPos = selectGridPos;
        window.applyPreset = applyPreset;
        window.clearCompleted = clearCompleted;

        loadInitialData();
    </script>
</body>

</html>
